default_stages: [pre-push]
repos:
  - repo: https://github.com/ref-app/prek-pinact
    rev: 34d8549afc9bda24131bd9b49b2526ff0bba8a15  # frozen: v5.0.2
    hooks:
      - id: pinact
  - repo: local
    hooks:
      - id: prek-autoupdate
        name: prek autoupdate --freeze
        entry: prek autoupdate --freeze
        language: system
        pass_filenames: false
        always_run: true
