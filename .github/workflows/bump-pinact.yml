name: Bump pinact

on:
  schedule:
    - cron: '0 6 * * 1'  # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version: stable

      - name: Resolve latest upstream tag
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=$(gh release view --repo suzuki-shunsuke/pinact --json tagName -q .tagName)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Read currently pinned version
        id: current
        run: |
          version=$(grep -oE 'pinact/v[0-9]+/cmd/pinact@v[0-9.]+' .pre-commit-hooks.yaml | head -n1 | sed 's/.*@//')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Stop if already current
        if: steps.latest.outputs.tag == steps.current.outputs.version
        run: echo "Already pinned to ${{ steps.current.outputs.version }}; nothing to do."

      - name: Apply bump locally
        if: steps.latest.outputs.tag != steps.current.outputs.version
        env:
          NEW: ${{ steps.latest.outputs.tag }}
        run: |
          set -euo pipefail
          major=${NEW#v}; major=${major%%.*}
          sed -i -E "s|pinact/v[0-9]+/cmd/pinact@v[0-9.]+|pinact/v${major}/cmd/pinact@${NEW}|g" .pre-commit-hooks.yaml
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Bump pinact to ${NEW}"

      - name: Install prek
        if: steps.latest.outputs.tag != steps.current.outputs.version
        uses: j178/prek-action@bdca6f102f98e2b4c7029491a53dfd366469e33d  # v2.0.4
        with:
          install-only: true

      - name: Verify new release through prek
        if: steps.latest.outputs.tag != steps.current.outputs.version
        run: |
          set -euo pipefail
          scratch=$(mktemp -d)
          rev=$(git rev-parse HEAD)
          cp -r tests/fixture/. "$scratch/"
          cd "$scratch"
          git init -q
          git -c user.email=ci@local -c user.name=ci add .
          git -c user.email=ci@local -c user.name=ci commit -qm fixture
          cat > prek.toml <<EOF
          [[repos]]
          repo = "file://${GITHUB_WORKSPACE}"
          rev = "${rev}"
          [[repos.hooks]]
          id = "pinact"
          EOF
          prek run pinact --all-files

      - name: Push, tag, release
        if: steps.latest.outputs.tag != steps.current.outputs.version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW: ${{ steps.latest.outputs.tag }}
        run: |
          set -euo pipefail
          git tag "${NEW}"
          git push origin HEAD:main
          git push origin "${NEW}"
          gh release create "${NEW}" \
            --title "${NEW}" \
            --notes "Pins pinact ${NEW}. Upstream: https://github.com/suzuki-shunsuke/pinact/releases/tag/${NEW}"
